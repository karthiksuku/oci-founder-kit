<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer workspace</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/api/b2b/portal.css">
<main>
  <h1>Customer workspace</h1>
  <p id="status" role="status" aria-live="polite"></p>
  <section>
    <h2>Organizations</h2>
    <label>Your invitation recipient ID <input id="recipient" readonly></label>
    <form id="create"><label>Organization name <input name="name" maxlength="120" required></label><button>Create organization</button></form>
    <form id="accept"><label>Organization ID <input name="organization" required></label>
      <label>Invitation code <input name="token" type="password" autocomplete="off" required></label><button>Accept invitation</button></form>
    <label>Open organization <select id="organizations"></select></label>
  </section>
  <section id="workspace" hidden>
    <h2 id="org-name"></h2>
    <p>Organization ID <code id="org-id"></code></p>
    <form id="create-request"><label>Request title <input name="title" maxlength="200" required></label><button>Add request</button></form>
    <h3>Recent requests</h3>
    <ul id="requests"></ul>
    <section id="admin" hidden>
      <h3>Manage access</h3>
      <form id="invite"><label>Recipient ID <input name="recipient" required></label>
        <label>Role <select name="role"><option>member</option><option>admin</option></select></label><button>Create invitation</button></form>
      <p id="code-box" hidden>Share this code and the organization ID privately with the recipient.
        <label>One-time code <input id="code" readonly></label></p>
      <h4>Pending invitations</h4><ul id="invitations"></ul>
      <h4>Members</h4><ul id="members"></ul>
      <button type="button" id="export">Download organization requests</button>
    </section>
  </section>
</main>
<script type="module" src="/api/b2b/portal.mjs"></script>
</html>
