<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <h1>Taskboard</h1>
    <nav aria-label="Account"><a id="sign-in" href="/auth/login" hidden>Sign in</a><button id="sign-out" type="button" hidden>Sign out</button><span id="account-state"></span></nav>
    <p class="sub">Reference app for the OCI Founder Kit: API, PostgreSQL and Object Storage on OCI.</p>
  </header>
  <main>
    <form hidden id="new-task" class="new-task" autocomplete="off">
      <label for="title" class="visually-hidden">New task</label>
      <input id="title" name="title" maxlength="200" placeholder="Add a task" required>
      <button type="submit">Add</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="tasks" class="tasks"></ul>
    <p id="empty" class="empty" hidden>No tasks yet. Add the first one above.</p>
  </main>
  <footer class="foot"><span id="health">Checking the database…</span></footer>
</body>
</html>
