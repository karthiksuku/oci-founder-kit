<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none">
  <title>OCI Founder Kit — build on OCI with the agent you already use</title>
  <desc>An open source toolkit for Claude Code and Codex. Set up OCI, build an app, or migrate an existing workload. You review cloud changes before they run.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#101C26"/><stop offset="1" stop-color="#182F3A"/></linearGradient>
    <linearGradient id="orb" x1="980" y1="0" x2="1190" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#7ADBC1" stop-opacity=".18"/><stop offset="1" stop-color="#7ADBC1" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#surface)"/>
  <circle cx="1110" cy="76" r="250" fill="url(#orb)"/>
  <path d="M1091 0V420M1167 0V420M1243 0V420M1015 0V420M939 0V420M863 0V420M787 0V420M711 0V420M0 76H1280M0 152H1280M0 228H1280M0 304H1280M0 380H1280" stroke="#FFFFFF" stroke-opacity=".025"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="56" y="46" width="28" height="28" rx="8" fill="#85E5C7"/>
    <path d="M63 55L68 60L63 65M72 65H78" stroke="#10212B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="66" fill="#F4F5F0" font-size="18" font-weight="600" letter-spacing=".2">OCI FOUNDER KIT</text>
    <text x="56" y="152" fill="#F4F5F0" font-size="58" font-weight="650" letter-spacing="-2">Build on OCI.</text>
    <text x="56" y="221" fill="#85E5C7" font-size="58" font-weight="650" letter-spacing="-2">Keep your own agent.</text>
    <text x="58" y="270" fill="#BCCCD1" font-size="21">From a first idea to a reviewed cloud deployment.</text>
    <rect x="56" y="321" width="138" height="36" rx="18" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="77" y="344" fill="#DAE5E8" font-size="14" font-weight="500">Claude Code</text>
    <rect x="205" y="321" width="95" height="36" rx="18" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="228" y="344" fill="#DAE5E8" font-size="14" font-weight="500">Codex</text>
    <text x="321" y="344" fill="#91A7AF" font-size="14">Your project. Your OCI account.</text>
    <rect x="779" y="64" width="445" height="292" rx="16" fill="#0C171F" stroke="#3B515B"/>
    <path d="M779 108H1224" stroke="#30434D"/>
    <circle cx="801" cy="87" r="4" fill="#F19F83"/><circle cx="817" cy="87" r="4" fill="#D5BD82"/><circle cx="833" cy="87" r="4" fill="#85C5B1"/>
    <text x="863" y="92" fill="#839DA9" font-size="12" font-family="monospace">your-project / coding agent</text>
    <text x="805" y="146" fill="#85E5C7" font-size="15" font-family="monospace">&gt; Use oci-kit to build my app.</text>
    <text x="805" y="187" fill="#7F9CA7" font-size="14" font-family="monospace">01</text><text x="838" y="187" fill="#E8EEEE" font-size="16">Inspect and build locally</text>
    <text x="805" y="222" fill="#7F9CA7" font-size="14" font-family="monospace">02</text><text x="838" y="222" fill="#E8EEEE" font-size="16">Prepare the OCI foundation</text>
    <text x="805" y="257" fill="#7F9CA7" font-size="14" font-family="monospace">03</text><text x="838" y="257" fill="#E8EEEE" font-size="16">Review the plan and costs</text>
    <rect x="802" y="283" width="397" height="44" rx="9" fill="#28312D"/>
    <circle cx="820" cy="305" r="4" fill="#F0C98B"/>
    <text x="835" y="310" fill="#F0C98B" font-size="14" font-weight="500">Cloud changes wait for your approval</text>
  </g>
