# Copy to .github/workflows/validate.yml using a credential allowed to manage workflows.
name: Validate kit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: founder_test
          POSTGRES_DB: founder_test
          # Disposable runner-only fixtures, never a deployed/shared database.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U founder_test -d founder_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python3 scripts/validate.py
      - run: python3 scripts/hooks.py public --project .
      - run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: blueprints/fullstack-container/app/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: blueprints/fullstack-container/app
      - run: npm test
        working-directory: blueprints/fullstack-container/app
        env:
          TEST_DATABASE_URL: postgresql://founder_test@127.0.0.1:5432/founder_test
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.6'
      - run: terraform fmt -check -recursive blueprints
      - run: terraform -chdir=blueprints/foundation/terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=blueprints/foundation/terraform validate
      - run: terraform -chdir=blueprints/fullstack-container/registry init -backend=false -lockfile=readonly
      - run: terraform -chdir=blueprints/fullstack-container/registry validate
      - run: terraform -chdir=blueprints/fullstack-container/terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=blueprints/fullstack-container/terraform validate
      - run: terraform -chdir=blueprints/fullstack-container/terraform test
  founder-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
