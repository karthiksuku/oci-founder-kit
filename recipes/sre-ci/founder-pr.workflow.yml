name: Founder application PR checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm@sha256:59ab0bbd4930fcd32dd4389836c0bfbf87431ffa87097c739a71210f7aed58c9
        env:
          POSTGRES_USER: founder_test
          POSTGRES_DB: founder_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U founder_test -d founder_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Unit, runtime and project-specific checks (ephemeral; no cloud credentials)
        env:
          # Set FOUNDER_APP_DIR to app for a stock Taskboard, or to the Next.js app directory.
          APP_DIR: ${{ vars.FOUNDER_APP_DIR || '.' }}
          TEST_DATABASE_URL: postgresql://founder_test@127.0.0.1:5432/founder_test
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -eu
          cd -- "$APP_DIR"
          npm ci --ignore-scripts --no-audit
          npm run lint --if-present
          npm run typecheck --if-present
          npm run build --if-present
          # Fail rather than silently pass a project with no test suite.
          npm test
          # Project-owned, committed browser tests. Check keyboard navigation, names and
          # contrast on the critical journey using the app's Playwright/axe integration.
          # Missing scripts fail this UI profile; they never produce a green waiver.
          test -x ./node_modules/.bin/playwright
          ./node_modules/.bin/playwright install --with-deps chromium
          npm run test:browser
          npm run test:a11y
  source-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the reviewed scanner (Linux x86-64)
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o trivy.tar.gz
          echo 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tar.gz' | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          echo '6a972c69606c7b3ea4c6bdcc6fc9332ea9ad38381624310c1e85cc77345909f3  trivy' | sha256sum -c -
      - name: Source hygiene (no uploaded findings; release image coverage is separate)
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          ./trivy fs --disable-telemetry --config '' --ignorefile '' --secret-config '' \
            --scanners secret,misconfig --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json --output "$RUNNER_TEMP/private-pr-results.json" --exit-code 1 "$GITHUB_WORKSPACE"
      - name: Locked application dependencies (runtime image scan is a separate required gate)
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          ./trivy fs --disable-telemetry --config '' --ignorefile '' --scanners vuln \
            --severity UNKNOWN,HIGH,CRITICAL --skip-dirs .git --format json \
            --output "$RUNNER_TEMP/private-pr-dependencies.json" --exit-code 1 "$GITHUB_WORKSPACE"
