AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Taskboard serverless API

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      Runtime: python3.12
      Events:
        Http:
          Type: Api
          Properties:
            Path: /tasks
            Method: get

  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST

  UploadsBucket:
    Type: "AWS::S3::Bucket"

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod

  ReportingDb:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: mysql
      DBInstanceClass: db.t4g.micro

  InternalNlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: network
      Scheme: internal

  Tracing:
    Type: AWS::XRay::Group
    Properties:
      GroupName: taskboard

  FeatureFlags:
    Type: AWS::AppConfig::Application
    Properties:
      Name: taskboard-flags
